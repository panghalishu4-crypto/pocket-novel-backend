<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Novel - Chapter Reader</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }

    body { 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #ffffff; min-height: 100vh; padding: 20px; 
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .navbar {
      background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px 25px; 
      border-radius: 16px; display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 25px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15); color: white; border: none;
      padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600;
      transition: background 0.2s;
    }
    .back-btn:hover { background: rgba(255, 255, 255, 0.25); }

    .coins-badge { 
      background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #2d0b31; 
      padding: 8px 16px; border-radius: 30px; font-weight: 800; font-size: 14px; 
    }

    .container { max-width: 800px; margin: 0 auto; }

    /* Chapters List */
    .chapter-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 18px 24px; border-radius: 14px; margin-bottom: 15px;
      display: flex; justify-content: space-between; align-items: center;
      transition: all 0.3s ease;
    }

    .chapter-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.08); }

    .action-btn {
      padding: 8px 18px; border-radius: 8px; border: none; font-weight: 700; cursor: pointer;
      transition: opacity 0.2s;
    }
    .action-btn:active { opacity: 0.8; }
    .btn-free { background: #00c6ff; color: #002b49; }
    .btn-lock { background: #ff007f; color: white; }
    .btn-unlocked { background: #2ecc71; color: white; }

    /* Story Reading Box */
    .reader-box {
      display: none; background: rgba(15, 12, 41, 0.95); border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 30px; border-radius: 20px; margin-top: 25px; line-height: 1.8; font-size: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5); animation: fadeIn 0.4s ease-in-out;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .reader-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .reader-box h3 { color: #ff007f; font-size: 22px; }
    .reading-text { color: #e0e0e0; white-space: pre-line; word-break: break-word; }
    
    .story-actions { display: flex; gap: 10px; }
    .icon-action-btn { font-size: 22px; background: rgba(255,255,255,0.08); border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; transition: background 0.2s; }
    .icon-action-btn:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <div class="navbar">
    <button class="back-btn" onclick="window.location.href='dashboard.html'">← Back to Dashboard</button>
    <div class="coins-badge">🪙 <span id="coins-display">0</span> Coins</div>
  </div>

  <div class="container">
    <h2 id="novel-title" style="margin-bottom: 20px;">📖 Chapters List</h2>

    <!-- Chapter List Container -->
    <div id="chapters-list">Loading chapters...</div>

    <!-- Story Reading Area -->
    <div id="reader-box" class="reader-box">
      <div class="reader-header">
        <h3 id="reading-chapter-title">Chapter Title</h3>
        <div class="story-actions">
          <button class="icon-action-btn" onclick="likeNovel()" title="Like Novel">❤️</button>
          <button class="icon-action-btn" onclick="bookmarkNovel()" title="Bookmark Novel">🔖</button>
        </div>
      </div>
      <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.15); margin-bottom: 20px;">
      <div id="reading-content" class="reading-text">Chapter text goes here...</div>
    </div>
    <div style="margin-top: 40px; background: rgba(255, 255, 255, 0.05); padding: 25px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.1);">
      <h3 style="margin-bottom: 15px; color: #00dfd8;">💬 Chapter Comments</h3>
      
      <div style="display: flex; gap: 10px; margin-bottom: 20px;">
        <input type="text" id="comment-input" class="form-control" placeholder="Share your thoughts on this chapter..." style="flex: 1; padding: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); border-radius: 10px; color: white;">
        <button onclick="postComment()" class="view-btn" style="width: 120px; background: linear-gradient(135deg, #00dfd8, #0072ff);">Post</button>
      </div>

      <div id="comments-list" style="display: flex; flex-direction: column; gap: 12px;">
        <p style="color: #b8c1ec; font-size: 14px;">No comments yet. Be the first to comment!</p>
      </div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://pocket-novel-backend.onrender.com";
    const urlParams = new URLSearchParams(window.location.search);
    const novelId = urlParams.get("novel_id");

    const userInfo = JSON.parse(localStorage.getItem("user_info")) || { coins: 0, user_id: null };
    if (!userInfo || !userInfo.user_id) {
      window.location.href = "index.html";
    }

    document.getElementById("coins-display").innerText = userInfo.coins;
    let activeChapterId = null;

    async function loadChapters() {
      try {
        const res = await fetch(`${BASE_URL}/novel/${novelId}/chapters?user_id=${userInfo.user_id}`);
        const data = await res.json();
        const container = document.getElementById("chapters-list");

        if (data.novel_title) {
          document.getElementById("novel-title").innerText = `📖 ${data.novel_title}`;
        }

        if (data.chapters && data.chapters.length > 0) {
          container.innerHTML = data.chapters.map(ch => {
            let btnClass = "btn-free";
            let btnText = "📖 Read Free";

            if (ch.is_locked && !ch.is_unlocked) {
              btnClass = "btn-lock";
              btnText = "🔒 Unlock (10 🪙)";
            } else if (ch.is_unlocked) {
              btnClass = "btn-unlocked";
              btnText = "✅ Unlocked - Read";
            }

            return `
              <div class="chapter-card">
                <div>
                  <strong>Chapter ${ch.chapter_number}: ${ch.chapter_title}</strong>
                </div>
                <button class="action-btn ${btnClass}" 
                  onclick="handleChapterClick(${ch.chapter_id}, ${ch.is_locked && !ch.is_unlocked})">
                  ${btnText}
                </button>
              </div>
            `;
          }).join('');
        } else {
          container.innerHTML = "<p style='color: #b8c1ec;'>No chapters added yet for this novel.</p>";
        }
      } catch (err) {
        document.getElementById("chapters-list").innerText = "Failed to load chapters!";
      }
    }

    async function handleChapterClick(chapterId, isLocked) {
      if (isLocked) {
        if (confirm("Unlock this chapter for 10 Coins?")) {
          unlockChapter(chapterId);
        }
      } else {
        readChapter(chapterId);
      }
    }

    async function unlockChapter(chapterId) {
      try {
        const res = await fetch(`${BASE_URL}/unlock-chapter`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userInfo.user_id, chapter_id: chapterId })
        });
        const data = await res.json();

        if (res.ok) {
          alert("🎉 Chapter Unlocked Successfully!");
          userInfo.coins = data.remaining_coins !== undefined ? data.remaining_coins : (userInfo.coins - 10);
          localStorage.setItem("user_info", JSON.stringify(userInfo));
          document.getElementById("coins-display").innerText = userInfo.coins;
          
          loadChapters(); 
          readChapter(chapterId); 
        } else {
          alert(data.detail || "Not enough coins! Please claim daily rewards or top-up.");
        }
      } catch (err) {
        alert("Server error during unlock!");
      }
    }

    async function readChapter(chapterId) {
      activeChapterId = chapterId;
      try {
        const res = await fetch(`${BASE_URL}/chapter/${chapterId}?user_id=${userInfo.user_id}`);
        const data = await res.json();

        if (res.ok && (data.status === "success" || data.content)) {
          const readerBox = document.getElementById("reader-box");
          document.getElementById("reading-chapter-title").innerText = `Chapter ${data.chapter_number}: ${data.chapter_title}`;
          document.getElementById("reading-content").innerHTML = (data.content || "").replace(/\n/g, '<br/><br/>');
          readerBox.style.display = "block";
          readerBox.scrollIntoView({ behavior: 'smooth' });
        } else {
          alert(data.detail || data.message || "Unable to load chapter content.");
        }
      } catch (err) {
        alert("Failed to read chapter!");
      }
    }

    async function likeNovel() {
      try {
        const res = await fetch(`${BASE_URL}/toggle-like`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userInfo.user_id, novel_id: parseInt(novelId) })
        });
        const data = await res.json();
        alert(`Story ${data.action || 'liked'}! ❤️`);
      } catch (err) {
        alert("Failed to like novel!");
      }
    }

    async function bookmarkNovel() {
      try {
        const res = await fetch(`${BASE_URL}/toggle-bookmark`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ user_id: userInfo.user_id, novel_id: parseInt(novelId) })
        });
        const data = await res.json();
        alert(`Story ${data.action || 'bookmarked'}! 🔖`);
      } catch (err) {
        alert("Failed to bookmark novel!");
      }
    }

    if (novelId) {
      loadChapters();
    } else {
      document.getElementById("chapters-list").innerHTML = "<p>No novel selected!</p>";
    }
    // Comment post karne ka function
    async function postComment() {
      const commentText = document.getElementById("comment-input").value.trim();
      if (!commentText) return alert("Please write something!");

      try {
        // Jab aap backend par comment API bana lenge, tab yahan fetch() lag jayega
        alert("Comment posted successfully!");
        document.getElementById("comment-input").value = "";
      } catch (err) {
        alert("Failed to post comment.");
      }
    }
  </script>
</body>
</html>
