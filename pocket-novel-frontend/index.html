<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Novel - Welcome</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; margin: 0; padding: 0; }

    body { 
      background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      color: #ffffff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card { 
      background: rgba(255, 255, 255, 0.07); 
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 35px 30px; 
      border-radius: 20px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
      width: 100%; 
      max-width: 400px; 
      text-align: center; 
    }

    h1 { color: #fff; margin-bottom: 8px; font-size: 28px; }
    p { color: #b8c1ec; font-size: 14px; margin-bottom: 20px; }

    .bonus-badge { 
      background: rgba(255, 193, 7, 0.15); 
      color: #ffda6a; 
      border: 1px solid rgba(255, 193, 7, 0.3); 
      border-radius: 20px; 
      padding: 8px 14px; 
      font-size: 13px; 
      font-weight: 600; 
      display: inline-block; 
      margin-bottom: 20px; 
    }

    .input-group { margin-bottom: 18px; text-align: left; }
    label { display: block; font-size: 13px; font-weight: 600; color: #e0e0e0; margin-bottom: 6px; }
    
    input { 
      width: 100%; 
      padding: 12px 14px; 
      background: rgba(255, 255, 255, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 10px; 
      font-size: 14px; 
      color: white;
      outline: none; 
      transition: border-color 0.2s;
    }
    input::placeholder { color: rgba(255, 255, 255, 0.4); }
    input:focus { border-color: #00dfd8; }

    button { 
      width: 100%; 
      background: linear-gradient(135deg, #00dfd8, #0072ff); 
      color: white; 
      border: none; 
      padding: 14px; 
      font-size: 16px; 
      font-weight: 700; 
      border-radius: 10px; 
      cursor: pointer; 
      margin-top: 10px; 
      transition: opacity 0.2s, transform 0.2s; 
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:disabled { background: #555; cursor: not-allowed; transform: none; }

    .switch-text { margin-top: 20px; font-size: 13px; color: #b8c1ec; }
    .switch-text span#toggle-link { color: #00dfd8; cursor: pointer; font-weight: 600; text-decoration: underline; }
    
    #message { margin-top: 15px; font-size: 14px; font-weight: 600; }
    .success { color: #38ef7d; }
    .error { color: #ff4b2b; }
  </style>
</head>
<body>

  <div class="card">
    <h1>📖 Pocket Novel</h1>
    <p id="sub-title">Sign in to read your favorite novels</p>

    <!-- Welcome Bonus Badge -->
    <div id="bonus-tag" class="bonus-badge" style="display: none;">
      🎁 Sign up today & get 🪙 100 Free Coins!
    </div>

    <div class="input-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" required>
    </div>

    <div class="input-group" id="email-group" style="display: none;">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter email">
    </div>

    <div class="input-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>
    </div>

    <button id="submit-btn" onclick="handleSubmit()">Login</button>

    <div class="switch-text">
      <span id="toggle-msg">Don't have an account?</span> 
      <span id="toggle-link" onclick="toggleForm()">Sign Up</span>
    </div>

    <p id="message"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
